[project]
name = "bright-smile-receptionist"
version = "0.1.0"
description = "LiveKit voice agent (dental clinic receptionist) + admin API + evals"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.164.0",
    "livekit-agents[silero,turn-detector]~=1.8",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-repeat>=0.9.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
